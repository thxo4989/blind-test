<!DOCTYPE html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blind Test</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,Segoe UI,Arial,sans-serif;color:#fff;background:linear-gradient(135deg,#1b0b3a,#4a1166 55%,#c2185b);background-attachment:fixed}
main{max-width:900px;margin:0 auto;padding:20px}
h1{text-align:center;font-size:2.2rem;margin:10px 0 20px}
.card{background:rgba(255,255,255,.1);border-radius:16px;padding:18px;margin-bottom:16px;backdrop-filter:blur(6px)}
button{font:inherit;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;color:#fff;background:#7c3aed;font-weight:600}
button:hover{filter:brightness(1.15)}
button.big{font-size:1.2rem;padding:16px 26px;background:#e91e63}
button.alt{background:rgba(255,255,255,.2)}
button.plus{background:#16a34a}
button.minus{background:#dc2626}
input,select{font:inherit;padding:10px;border-radius:10px;border:0;margin-right:6px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{background:rgba(255,255,255,.2);border-radius:20px;padding:6px 12px}
.chip b{cursor:pointer;margin-left:8px}
#game{display:none}
.stage{text-align:center}
.cover{width:170px;height:170px;border-radius:16px;margin:10px auto;display:flex;align-items:center;justify-content:center;font-size:4rem;background:rgba(0,0,0,.3);background-size:cover}
#answer{font-size:1.5rem;font-weight:700;min-height:2.2rem;margin:8px 0}
#status{opacity:.8;min-height:1.4rem}
.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.player{background:rgba(0,0,0,.28);border-radius:14px;padding:14px;text-align:center}
.player .name{font-weight:700;font-size:1.1rem}
.player .score{font-size:2.6rem;font-weight:800;margin:6px 0}
.player .btns{display:flex;gap:8px;justify-content:center}
.small{font-size:.85rem;opacity:.75;text-align:center}
</style>
</head>
<body>
<main>
<h1>🎵 Blind Test</h1>

<section id="setup" class="card">
  <h2>Joueurs</h2>
  <div class="row">
    <input id="pname" placeholder="Nom du joueur" maxlength="20">
    <button id="addP">Ajouter</button>
  </div>
  <div class="chips" id="chips"></div>
  <h2>Musiques</h2>
  <div class="row">
    <select id="lvl">
      <option value="easy">Facile (les plus connus, même des enfants)</option>
      <option value="mid">Moyen (grands classiques)</option>
      <option value="hard">Difficile (connus, mais moins évidents)</option>
      <option value="all">Tous niveaux mélangés</option>
    </select>
    <select id="cat">
      <option value="all">Tout mélangé</option>
      <option value="us">Pop américaine</option>
      <option value="fr">Pop / chanson française</option>
      <option value="disney">🏰 Disney : devine le film</option>
    </select>
    <button class="big" id="start">Commencer</button>
  </div>
  <p class="small"><span id="count"></span> musiques disponibles. Internet est nécessaire (extraits de 30 s).</p>
</section>

<section id="game">
  <div class="card stage">
    <div id="status">Prêt !</div>
    <div class="cover" id="cover">❓</div>
    <div id="answer"></div>
    <div class="row">
      <button class="big" id="next">▶ Musique suivante</button>
      <button class="alt" id="pp">⏯ Pause / Lecture</button>
      <button class="alt" id="replay">↺ Rejouer</button>
      <button id="reveal">👁 Voir la réponse</button>
    </div>
    <audio id="aud"></audio>
    <p class="small">Raccourcis : Espace = pause · R = réponse · N = suivante</p>
  </div>
  <div class="card">
    <div class="players" id="players"></div>
  </div>
  <div class="row">
    <button class="alt" id="resetScores">Remettre les scores à 0</button>
    <button class="alt" id="back">⚙ Modifier joueurs / style</button>
  </div>
</section>
</main>

function disneyPick(res, song, norm) {
  const z = x => norm(x).replace(/[^a-z0-9]/g, '');
  const bad = /karaoke|tribute|cover|lullaby|instrumental|originally|piano|made famous/i;
  const c = res.filter(r => r.previewUrl && z(r.trackName).includes(z(song.t)) && !bad.test(r.trackName + ' ' + r.collectionName + ' ' + r.artistName));
  return c.find(r => /disney|soundtrack|cast|pixar/i.test(r.collectionName + ' ' + r.artistName)) || c[0] || null;
}

const pool = () => { const c = $('cat').value, l = $('lvl').value; if (c === 'disney') return SONGS.filter(s => s.k === 'disney'); return SONGS.filter(s => s.k !== 'disney' && (c === 'all' || s.k === c) && (l === 'all' || s.l === l)); };
const upd = () => { $('lvl').style.display = $('cat').value === 'disney' ? 'none' : ''; $('count').textContent = pool().length; };
$('cat').onchange = $('lvl').onchange = upd; upd();

function renderChips() {
  $('chips').innerHTML = '';
  players.forEach((p, i) => {
    const c = document.createElement('span'); c.className = 'chip'; c.textContent = p.name;
    const x = document.createElement('b'); x.textContent = '✕';
    x.onclick = () => { players.splice(i, 1); save(); renderChips(); };
    c.appendChild(x); $('chips').appendChild(c);
  });
}
function renderPlayers() {
  $('players').innerHTML = '';
  players.forEach(p => {
    const d = document.createElement('div'); d.className = 'player';
    d.innerHTML = '<div class="name"></div><div class="score"></div><div class="btns"><button class="plus">+1</button><button class="minus">−1</button></div>';
    d.querySelector('.name').textContent = p.name;
    d.querySelector('.score').textContent = p.score;
    d.querySelector('.plus').onclick = () => { p.score++; save(); renderPlayers(); };
    d.querySelector('.minus').onclick = () => { p.score--; save(); renderPlayers(); };
    $('players').appendChild(d);
  });
}
function addPlayer() {
  const n = $('pname').value.trim();
  if (!n) return;
  players.push({name: n, score: 0}); $('pname').value = ''; save(); renderChips(); $('pname').focus();
}
$('addP').onclick = addPlayer;
$('pname').onkeydown = e => { if (e.key === 'Enter') addPlayer(); };

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function buildQueue() { queue = shuffle(pool()); }

$('start').onclick = () => {
  if (!players.length) { alert('Ajoute au moins un joueur !'); return; }
  buildQueue(); $('setup').style.display = 'none'; $('game').style.display = 'block'; renderPlayers(); nextSong();
};
$('back').onclick = () => { $('aud').pause(); $('game').style.display = 'none'; $('setup').style.display = 'block'; renderChips(); };
$('resetScores').onclick = () => { if (confirm('Remettre tous les scores à 0 ?')) { players.forEach(p => p.score = 0); save(); renderPlayers(); } };

function lookup(song) {
  return new Promise(resolve => {
    const cb = 'cb' + Date.now() + Math.floor(Math.random() * 1e6);
    const s = document.createElement('script');
    const done = r => { delete window[cb]; s.remove(); clearTimeout(tm); resolve(r); };
    const tm = setTimeout(() => done(null), 8000);
    window[cb] = data => {
      const norm = x => x.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      const first = norm(song.a).split(/[ ,&]/)[0];
      const hit = song.m ? disneyPick(data.results || [], song, norm) : (data.results || []).find(r => r.previewUrl && norm(r.artistName).includes(first));
      done(hit || null);
    };
    s.onerror = () => done(null);
    s.src = 'https://itunes.apple.com/search?media=music&entity=song&limit=10&country=' + (song.m ? 'US' : 'FR') + '&callback=' + cb + '&term=' + encodeURIComponent(song.m ? song.t + ' ' + song.q + ' disney' : song.a + ' ' + song.t);
    document.head.appendChild(s);
  });
}

async function nextSong() {
  const my = ++token;
  $('aud').pause();
  $('answer').textContent = ''; $('cover').style.backgroundImage = ''; $('cover').textContent = '❓';
  for (let tries = 0; tries < 6; tries++) {
    if (!queue.length) buildQueue();
    const song = queue.pop();
    $('status').textContent = 'Chargement de la musique…';
    const hit = await lookup(song);
    if (my !== token) return;
    if (hit) {
      current = {song, hit};
      $('aud').src = hit.previewUrl;
      try { await $('aud').play(); $('status').textContent = '🎧 Écoute bien… (extrait de 30 s)'; }
      catch (e) { $('status').textContent = 'Clique sur « Pause / Lecture » pour lancer.'; }
      return;
    }
  }
  $('status').textContent = 'Impossible de charger une musique : vérifie ta connexion internet.';
}

function reveal() {
  if (!current) return;
  $('answer').textContent = current.song.m ? '🎬 ' + current.song.m + ' (' + current.song.t + ')' : current.song.a + ' — ' + current.song.t;
  const art = (current.hit.artworkUrl100 || '').replace('100x100', '300x300');
  if (art) { $('cover').style.backgroundImage = 'url(' + art + ')'; $('cover').textContent = ''; }
}
const toggle = () => { const a = $('aud'); a.paused ? a.play() : a.pause(); };
$('next').onclick = nextSong;
$('reveal').onclick = reveal;
$('pp').onclick = toggle;
$('replay').onclick = () => { $('aud').currentTime = 0; $('aud').play(); };
document.addEventListener('keydown', e => {
  if ($('game').style.display !== 'block' || e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  else if (e.key === 'r' || e.key === 'R') reveal();
  else if (e.key === 'n' || e.key === 'N') nextSong();
});
renderChips();
</script>
</body>
</html>
